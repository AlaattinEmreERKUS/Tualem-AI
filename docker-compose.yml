services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tualem_postgres
    environment:
      POSTGRES_DB: tualem_db
      POSTGRES_USER: tualem_emre
      POSTGRES_PASSWORD: tualem_1234
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tualem_emre -d tualem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: tualem_neo4j
    environment:
      NEO4J_AUTH: "neo4j/tualem_neo4j_password_123"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tualem_redis
    ports:
      - "6375:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user_module:
    build:
      context: .
      dockerfile: modules/user_module/Dockerfile
    container_name: tualem_user_module
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tualem_db
      POSTGRES_USER: tualem_emre
      POSTGRES_PASSWORD: tualem_1234
      PYTHONPATH: /app:/app/modules
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./modules/user_module:/app
      - ./shared:/app/shared

  graph_module:
    build:
      context: .
      dockerfile: modules/graph_module/Dockerfile
    container_name: tualem_graph_module
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tualem_db
      POSTGRES_USER: tualem_emre
      POSTGRES_PASSWORD: tualem_1234
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: tualem_neo4j_password_123
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/modules
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./modules/graph_module:/app
      - ./shared:/app/shared
      - media_data:/app/media

  chat_module:
    build:
      context: .
      dockerfile: modules/chat_module/Dockerfile
    container_name: tualem_chat_module
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tualem_db
      POSTGRES_USER: tualem_emre
      POSTGRES_PASSWORD: tualem_1234
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/modules
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./modules/chat_module:/app
      - ./shared:/app/shared

  frontend:
    build:
      context: .
      dockerfile: modules/frontend/Dockerfile
    container_name: tualem_frontend
    env_file:
      - .env
    environment:
      USER_MODULE_URL: http://user_module:8001
      GRAPH_MODULE_URL: http://graph_module:8002
      CHAT_MODULE_URL: http://chat_module:8003
      NEXT_PUBLIC_WS_URL: ws://localhost
    ports:
      - "3001:3000"
    depends_on:
      - user_module
      - graph_module
      - chat_module

  nginx:
    image: nginx:alpine
    container_name: tualem_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user_module
      - graph_module
      - chat_module
      - frontend

  celery_worker:
    build:
      context: .
      dockerfile: modules/graph_module/Dockerfile
    container_name: tualem_celery_worker
    command: celery -A core worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tualem_db
      POSTGRES_USER: tualem_emre
      POSTGRES_PASSWORD: tualem_1234
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: tualem_neo4j_password_123
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./modules/graph_module:/app
      - ./modules/chat_module:/app/modules/chat_module
      - ./shared:/app/shared
      - media_data:/app/media

volumes:
  postgres_data:
  neo4j_data:
  media_data: