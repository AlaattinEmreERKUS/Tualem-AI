services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tualem_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: tualem_neo4j
    environment:
      NEO4J_AUTH: "neo4j/neo4j_local_2024"
      NEO4J_server_memory_heap_initial__size: "128m"
      NEO4J_server_memory_heap_max__size: "256m"
      NEO4J_server_memory_pagecache_size: "64m"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tualem_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6375:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user_module:
    build:
      context: .
      dockerfile: modules/user_module/Dockerfile
    container_name: tualem_user_module
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONPATH: /app:/app/modules
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./modules/user_module:/app
      - ./shared:/app/shared
      - user_media_data:/app/media

  graph_module:
    build:
      context: .
      dockerfile: modules/graph_module/Dockerfile
    container_name: tualem_graph_module
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PYTHONPATH: /app:/app/modules
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./modules/graph_module:/app
      - ./shared:/app/shared
      - media_data:/app/media

  chat_module:
    build:
      context: .
      dockerfile: modules/chat_module/Dockerfile
    container_name: tualem_chat_module
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app:/app/modules
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./modules/chat_module:/app
      - ./shared:/app/shared

  frontend:
    build:
      context: .
      dockerfile: modules/frontend/Dockerfile
    container_name: tualem_frontend
    env_file:
      - .env
    environment:
      USER_MODULE_URL: http://user_module:8001
      GRAPH_MODULE_URL: http://graph_module:8002
      CHAT_MODULE_URL: http://chat_module:8003
      NEXT_PUBLIC_WS_URL: ws://localhost
    ports:
      - "3001:3000"
    depends_on:
      - user_module
      - graph_module
      - chat_module

  nginx:
    image: nginx:alpine
    container_name: tualem_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user_module
      - graph_module
      - chat_module
      - frontend

  celery_worker:
    build:
      context: .
      dockerfile: modules/graph_module/Dockerfile
    container_name: tualem_celery_worker
    command: celery -A core worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PYTHONPATH: /app:/app/modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./modules/graph_module:/app
      - ./shared:/app/shared
      - media_data:/app/media

volumes:
  postgres_data:
  neo4j_data:
  media_data:
  user_media_data:
