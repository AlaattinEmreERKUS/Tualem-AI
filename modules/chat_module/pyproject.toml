[project]
name = "chat-module"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.15",
    "psycopg2-binary>=2.9",
    "python-decouple>=3.8",
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
    "django-cors-headers>=4.3",
    "redis>=5.0",
    "channels>=4.1",
    "channels-redis>=4.1",
    "daphne>=4.1",
    "dj-database-url>=2.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
]

[tool.uv]
package = false
