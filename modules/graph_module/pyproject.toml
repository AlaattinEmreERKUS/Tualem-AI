[project]
name = "graph-module"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.15",
    "psycopg2-binary>=2.9",
    "python-decouple>=3.8",
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
    "django-cors-headers>=4.3",
    "neo4j>=5.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-groq>=0.2",
    "langchain-ollama>=0.2",
    "langchain-text-splitters>=0.3",
    "openai>=1.0",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
    "celery>=5.3",
    "redis>=5.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "arxiv>=2.0",
    "httpx>=0.27",
    "channels>=4.1",
    "daphne>=4.1",
    "django-storages[s3]>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
]

[tool.uv]
package = false
