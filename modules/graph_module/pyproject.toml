[project]
name = "graph-module"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.17",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.9",
    "python-dotenv>=1.2",
    "neo4j>=6.1",
    "pinecone>=8.1",
    "sentence-transformers>=5.4",
    "langchain-core>=1.3",
    "langchain-openai>=1.2",
    "langchain-text-splitters>=1.1",
    "langgraph>=0.2",
    "celery[redis]>=5.3",
    "PyMuPDF>=1.27",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
]

[tool.uv]
package = false
