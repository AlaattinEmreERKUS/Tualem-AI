name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-graph:
    name: graph_module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/graph_module
    env:
      DATABASE_URL: sqlite:///test_graph.sqlite3
      DJANGO_SECRET_KEY: ci-secret-key-for-testing-only-not-production
      JWT_SECRET: ci-jwt-secret-key-for-testing-32chars
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      REDIS_URL: ""
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test
      OPENROUTER_API_KEY: test-key
      GROQ_API_KEY: test-key
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/modules/graph_module

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: modules/graph_module/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test apps --verbosity=2

  test-chat:
    name: chat_module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/frontend/chat_module
    env:
      DATABASE_URL: sqlite:///test_chat.sqlite3
      DJANGO_SECRET_KEY: ci-secret-key-for-testing-only-not-production
      JWT_SECRET: ci-jwt-secret-key-for-testing-32chars
      REDIS_URL: ""
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/modules/frontend/chat_module

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: modules/frontend/chat_module/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test chat --verbosity=2

  test-user:
    name: user_module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/user_module
    env:
      DATABASE_URL: sqlite:///test_user.sqlite3
      DJANGO_SECRET_KEY: ci-secret-key-for-testing-only-not-production
      JWT_SECRET: ci-jwt-secret-key-for-testing-32chars
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"
      REDIS_URL: ""
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/modules/user_module

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: modules/user_module/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test apps --verbosity=2
