{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ProjeAdi{% endblock %}</title>

   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

   
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

<div class="page">

    <header class="navbar">
        <div class="nav-left">
            <span style="font-weight:700;">🧠 ProjeAdi</span>
        </div>

        <div class="nav-right">
            {% block nav %}{% endblock %}

          
            <button class="theme-btn" onclick="toggleTheme()" type="button" title="Tema değiştir">
                🌙
            </button>
        </div>
    </header>

   
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

   
    <footer class="footer">
        © 2026 ProjeAdi AI destekli bilişsel bilgi grafiği ve araştırma asistanı
    </footer>

</div>


<script>
function toggleTheme() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}


if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
</script>

</body>
</html>
