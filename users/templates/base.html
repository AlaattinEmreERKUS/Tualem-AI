{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CogniGraph{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

<div class="page">

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-left">ProjeAdi</div>

        <div class="nav-right">
            {% block nav %}{% endblock %}
            <button class="theme-btn" onclick="toggleTheme()" type="button">🌙</button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 ProjeAdi| AI destekli bilişsel bilgi grafiği ve araştırma asistanı
    </footer>

</div>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
</script>

</body>
</html>
